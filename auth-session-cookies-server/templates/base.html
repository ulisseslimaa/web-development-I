<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Webdev Cookie{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

    <nav class="flex items-center justify-between px-6 py-4 bg-white shadow-sm border-b border-gray-200">
        <a href="/" class="text-xl font-bold text-gray-900 tracking-tight">Webdev<em class="text-blue-600 not-italic">Cookie</em></a>
        <div class="flex items-center gap-3">
            {% block nav_actions %}{% endblock %}
        </div>
    </nav>

    <main class="flex flex-col items-center p-6 mt-10">
        <div class="w-full {% block wrap_class %}max-w-md{% endblock %}">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>

</html>
