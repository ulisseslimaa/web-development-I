<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cliente — WebDev-Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css" />
    <link rel="stylesheet" href="/static/styles/thema.css" />
</head>

<body>
    <main>
        <article>
            <hgroup>
                <h1>WebDev-Form</h1>
                <p>Preencha os dados abaixo para realizar seu cadastro.</p>
            </hgroup>

            <form action="/usuario/criar/" method="post" novalidate>
                <h2>Cadastro de Cliente</h2>

                {% if hasError %}
                <div class="error-banner" role="alert">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span>Verifique os campos destacados e tente novamente.</span>
                </div>
                {% endif %}

                <label for="user_name">
                    Nome Completo
                    <input type="text" id="user_name" name="user_name" placeholder="Ex.: Fulano da Silva"
                        value="{{ user.name if user else '' }}" autocomplete="name" {% if errors and errors.user_name
                        and errors.user_name.length> 0 %}aria-invalid="true"{% endif %} />
                    {% if errors and errors.user_name and errors.user_name.length > 0 %}
                    <small class="pico-color-red-500">
                        {% for m in errors.user_name %}{{ m }}{% if not loop.last %}<br />{% endif %}{% endfor %}
                    </small>
                    {% endif %}
                </label>

                <label for="user_birthday">
                    Data de Nascimento
                    <input type="date" id="user_birthday" name="user_birthday"
                        value="{{ user.birthday if user else '' }}" {% if errors and errors.user_birthday and
                        errors.user_birthday.length> 0 %}aria-invalid="true"{% endif %} />
                    {% if errors and errors.user_birthday and errors.user_birthday.length > 0 %}
                    <small class="pico-color-red-500">
                        {% for m in errors.user_birthday %}{{ m }}{% if not loop.last %}<br />{% endif %}{% endfor %}
                    </small>
                    {% endif %}
                </label>

                <label for="user_email">
                    E-mail
                    <input type="email" id="user_email" name="user_email" placeholder="fulano@exemplo.com"
                        value="{{ user.email if user else '' }}" autocomplete="email" {% if errors and errors.user_email
                        and errors.user_email.length> 0 %}aria-invalid="true"{% endif %} />
                    {% if errors and errors.user_email and errors.user_email.length > 0 %}
                    <small class="pico-color-red-500">
                        {% for m in errors.user_email %}{{ m }}{% if not loop.last %}<br />{% endif %}{% endfor %}
                    </small>
                    {% endif %}
                </label>

                <label for="user_password">
                    Senha
                    <input type="password" id="user_password" name="user_password"
                        placeholder="Mín. 8 chars com letra, número e símbolo" autocomplete="new-password" {% if errors
                        and errors.user_password and errors.user_password.length> 0 %}aria-invalid="true"{% endif %} />
                    {% if errors and errors.user_password and errors.user_password.length > 0 %}
                    <small class="pico-color-red-500">
                        {% for m in errors.user_password %}{{ m }}{% if not loop.last %}<br />{% endif %}{% endfor %}
                    </small>
                    {% endif %}
                </label>

                <div class="btn-row">
                    <button type="submit">Cadastrar</button>
                    <button type="reset" class="secondary">Limpar</button>
                </div>
            </form>
        </article>
    </main>
</body>

</html>
