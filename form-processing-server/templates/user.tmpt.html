<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cliente Cadastrado — WebDev-Form</title>
    <meta name="description" content="Cadastro realizado com sucesso." />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css" />
    <link rel="stylesheet" href="/static/styles/thema.css" />
</head>

<body>
    <main>
        <article>
            <hgroup>
                <h1>WebDev-Form</h1>
                <p>Cadastro realizado com sucesso.</p>
            </hgroup>

            <div class="success-header">
                <div class="success-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </div>
                <h2>Cliente Cadastrado com Sucesso</h2>
                <p class="subtitle">Os dados abaixo foram registrados em nosso sistema.</p>
            </div>

            <ul class="data-list">
                <li>
                    <span class="label">Nome Completo</span>
                    <span>{{ user.name }}</span>
                </li>
                <li>
                    <span class="label">E-mail</span>
                    <span>{{ user.email }}</span>
                </li>
                <li>
                    <span class="label">Data de Nascimento</span>
                    <span>{{ user.birthday }}</span>
                </li>
            </ul>

            <div class="btn-row">
                <a href="/" role="button" class="secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12" />
                        <polyline points="12 19 5 12 12 5" />
                    </svg>
                    Voltar ao formulário
                </a>
            </div>
        </article>
    </main>
</body>

</html>
